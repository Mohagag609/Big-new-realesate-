<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Content-Security-Policy:
    - default-src 'self': Allows loading resources (like CSS, fonts) from the same origin (the app's own files).
    - unsafe-inline: Allows the use of inline <script> tags and inline event handlers (like onclick).
      This is needed for our simple, self-contained example script below.
    - http://localhost:3000: Explicitly allows the page to make 'fetch' requests to our local backend server.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://localhost:3000;">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Desktop App</title>
  <!-- The user's custom stylesheet is linked here. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>My Todos</h1>
    <p>This is a simple todo list application running on Electron, with a local API.</p>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" required>
      <button type="submit">Add Todo</button>
    </form>

    <ul id="todo-list">
      <!-- Todo items will be dynamically inserted here -->
    </ul>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';

    // DOM Elements
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');

    /**
     * Renders the list of todos to the DOM.
     * @param {Array<Object>} todos - The array of todo items.
     */
    function renderTodos(todos) {
      todoList.innerHTML = ''; // Clear the list first
      if (todos.length === 0) {
        todoList.innerHTML = '<li>No todos yet. Add one!</li>';
        return;
      }
      todos.forEach(todo => {
        const li = document.createElement('li');
        li.textContent = todo.title;
        li.dataset.id = todo.id;
        li.className = todo.done ? 'done' : '';

        // Create a container for buttons
        const buttonContainer = document.createElement('div');

        // Create the 'Toggle Done' button
        const toggleButton = document.createElement('button');
        toggleButton.textContent = todo.done ? 'Undo' : 'Done';
        toggleButton.className = 'toggle-btn';
        toggleButton.addEventListener('click', () => toggleTodoStatus(todo.id, !todo.done));

        // Create the 'Delete' button
        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'Delete';
        deleteButton.className = 'delete-btn';
        deleteButton.addEventListener('click', () => deleteTodo(todo.id));

        buttonContainer.appendChild(toggleButton);
        buttonContainer.appendChild(deleteButton);
        li.appendChild(buttonContainer);

        todoList.appendChild(li);
      });
    }

    /**
     * Fetches all todos from the server and renders them.
     */
    async function fetchTodos() {
      try {
        const response = await fetch(`${API_URL}/todos`);
        if (!response.ok) throw new Error('Failed to fetch todos');
        const todos = await response.json();
        renderTodos(todos);
      } catch (error) {
        console.error('Error fetching todos:', error);
        todoList.innerHTML = '<li>Error loading todos. Is the server running?</li>';
      }
    }

    /**
     * Adds a new todo item.
     * @param {Event} event - The form submission event.
     */
    async function addTodo(event) {
      event.preventDefault();
      const title = todoInput.value.trim();
      if (!title) return;

      try {
        const response = await fetch(`${API_URL}/todos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        if (!response.ok) throw new Error('Failed to add todo');

        todoInput.value = ''; // Clear input field
        fetchTodos(); // Refresh the list
      } catch (error) {
        console.error('Error adding todo:', error);
      }
    }

    /**
     * Toggles the 'done' status of a todo.
     * @param {number} id - The ID of the todo.
     * @param {boolean} done - The new 'done' status.
     */
    async function toggleTodoStatus(id, done) {
      try {
        const response = await fetch(`${API_URL}/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done }),
        });
        if (!response.ok) throw new Error('Failed to update todo');
        fetchTodos(); // Refresh the list
      } catch (error) {
        console.error(`Error updating todo ${id}:`, error);
      }
    }

    /**
     * Deletes a todo item.
     * @param {number} id - The ID of the todo to delete.
     */
    async function deleteTodo(id) {
      if (!confirm('Are you sure you want to delete this todo?')) return;
      try {
        const response = await fetch(`${API_URL}/todos/${id}`, {
          method: 'DELETE',
        });
        if (!response.ok) throw new Error('Failed to delete todo');
        fetchTodos(); // Refresh the list
      } catch (error) {
        console.error(`Error deleting todo ${id}:`, error);
      }
    }

    // --- Initial Setup ---
    // Add event listener for the form submission
    todoForm.addEventListener('submit', addTodo);
    // Fetch initial list of todos when the page loads
    document.addEventListener('DOMContentLoaded', fetchTodos);
  </script>
</body>
</html>
